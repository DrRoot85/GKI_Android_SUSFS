name: Kernel Build - Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU Variant"
        required: true
        type: choice
        options:
          - SukiSU-Nova
          - BakaSU
          - FinaSU
        default: FinaSU
      build_channel:
        description: "Manager Build Channel"
        required: false
        type: choice
        options:
          - "Official (Release)"
          - "Latest (HEAD)"
        default: "Official (Release)"
      version:
        description: "Custom Kernel Version Name"
        required: false
        type: string
      build_time:
        description: "Custom Build Time (leave empty = automatically get current Beijing time) (Example: Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "KPM Feature (Supported by SukiSU-Nova only, enabled without patching)"
        required: true
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces Container Support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build Artifact Upload Mode"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip Only"
          - "Upload All"
        default: "Upload AnyKernel3.zip Only"
      ksu_mode:
        description: "KernelSU / SUSFS Mode"
        required: true
        type: choice
        options:
          - "Disabled"
          - "Disable SUSFS"
          - "Disable KernelSU"
        default: "Disabled"
      droidspaces_ntsync:
        description: "Enable Droidspaces Container NTSync Support (Requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable ZRAM Compression Algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG Baseband Protection"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable Network Enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel Driver"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount Mounting Meta-Module (Requires manually flashing the corresponding module)"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex Fix Chain"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus Snapdragon 8 Elite/Gen5 Support"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip features when incompatible or unavailable (without interrupting the build)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "Build Channel (Passed from main.yml; when triggered directly, uses the manager source fetched by this workflow)"
        required: false
        type: string
        default: "Official (Release)"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: "Disabled"
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload All"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: true
      called_from_main:
        description: "Whether called from main.yml (internal use)"
        required: false
        type: boolean
        default: false
      ksu_commit:
        description: "Latest official KernelSU commit used for the manager build (Passed from main.yml; when triggered directly, automatically uses the manager build fetched by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_size:
        description: "FinaSU Manager Signing Certificate DER Size (Passed from main.yml; when triggered directly, automatically uses the manager certificate fetched by this workflow)"
        required: false
        type: string
        default: ""

      ksu_cert_hash:
        description: "FinaSU Manager Signing Certificate SHA256 (Passed from main.yml; when triggered directly, automatically uses the manager certificate fetched by this workflow)"
        required: false
        type: string
        default: ""

jobs:
  build-kernels-a15-6-6:
    name: "6.6.${{ matrix.display_sub || matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: get-ksu-manager
    # Do not block the build if the manager job is skipped (called_from_main) or fails; if ksuCommit is empty, fall back to the input value or main HEAD
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - sub_level: "50"
          #   os_patch_level: "2024-10"
          # - sub_level: "56"
          #   os_patch_level: "2024-11"
          # - sub_level: "57"
          #   os_patch_level: "2024-12"
          # - sub_level: "58"
          #   os_patch_level: "2025-01"
          # - sub_level: "66"
          #   os_patch_level: "2025-02"
          # - sub_level: "77"
          #   os_patch_level: "2025-03"
          # - sub_level: "82"
          #   os_patch_level: "2025-04"
          # - sub_level: "87"
          #   os_patch_level: "2025-05"
          # - sub_level: "89"
          #   os_patch_level: "2025-06"
          # - sub_level: "92"
          #   os_patch_level: "2025-07"
          # - sub_level: "98"
          #   os_patch_level: "2025-09"
          # - sub_level: "102"
            # os_patch_level: "2025-10"
          - sub_level: "118"
            os_patch_level: "2026-01"
          # - sub_level: "127"
            # os_patch_level: "2026-04"
          # - sub_level: "139"
            # os_patch_level: "2026-07"
          # - sub_level: "143"
            # os_patch_level: "2026-10"
          - sub_level: "X"
            os_patch_level: "lts"
            display_sub: "lts"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      display_sub: ${{ matrix.display_sub || '' }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KernelSU' }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # Run only when triggered directly; skip when called from main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
