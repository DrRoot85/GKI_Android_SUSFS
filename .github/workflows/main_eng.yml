name: Kernel build workflow

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Basic configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      display_sub:
        description: "Display-only sub-version number for LTS builds (maintained by the data pipeline; used only for run/job naming)"
        required: false
        type: string
        default: ""
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU configuration ====================
      ksu_variant:
        required: true
        type: string
      build_channel:
        description: "Build channel: Release aligns with the official release; Latest (HEAD) follows the latest upstream commit (used only for labeling and summaries)"
        required: false
        type: string
        default: "Release"
      ksu_commit:
        description: "BakaSU only: check out KernelSU at this commit to align with the latest official uploaded build (leave empty to follow main HEAD)"
        required: false
        type: string
        default: ""
      ksu_cert_size:
        description: "FinaSU only: manager signing certificate DER size (0x hex, used to align the second trust slot)"
        required: false
        type: string
        default: ""
      ksu_cert_hash:
        description: "FinaSU only: manager signing certificate SHA256 (used to align the second trust slot)"
        required: false
        type: string
        default: ""

      # ==================== Optional configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
        default: "r1"
      build_time:
        required: false
        type: string
        default: ""

      # ==================== Feature switches ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: true
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      enable_susfs:
        required: true
        type: boolean
        default: true
      ksu_mode:
        required: false
        type: string
        default: "Off"
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip incompatible or unavailable features instead of stopping the build"
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.display_sub || inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-24.04
    # repo sync retries (3 x 20 minutes) + a full build need more than 60 minutes of headroom
    timeout-minutes: 90

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      SKIP_INCOMPATIBLE: ${{ inputs.skip_incompatible }}

    steps:
      - name: Build info summary
        run: |
          echo "========================================"
          echo "       Kernel build configuration summary"
          echo "========================================"
          echo "Android version : ${{ inputs.android_version }}"
          echo "Kernel version  : ${{ inputs.kernel_version }}"
          echo "Sub-level       : ${{ inputs.sub_level }}"
          echo "Patch level     : ${{ inputs.os_patch_level }}"
          echo "KSU variant     : ${{ inputs.ksu_variant }}"
          echo "Build channel   : ${{ inputs.build_channel }}"
          echo "Build time      : ${{ inputs.build_time }}"
          echo "SUSFS status    : ${{ inputs.enable_susfs }}"
          echo "ZRAM compression: ${{ inputs.use_zram }}"
          echo "BBG patch       : ${{ inputs.use_bbg }}"
          echo "Network enhance : ${{ inputs.use_net_enhance }}"
          echo "KPM             : ${{ inputs.use_kpm && 'On' || 'Off' }}"
          echo "NoMount module  : ${{ inputs.use_nomount && 'On' || 'Off' }}"
          echo "Re-Kernel     : ${{ inputs.use_rekernel }}"
          echo "CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}"
          echo "Droidspaces   : ${{ inputs.droidspaces }}"
          echo "NTSync        : ${{ inputs.droidspaces_ntsync }}"
          echo "Skip incompatible: ${{ inputs.skip_incompatible }}"
          echo "Artifact upload : ${{ inputs.artifact_upload_mode }}"
          echo "========================================"

      - name: Free up disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize build environment
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: Show configuration
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading config file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves lz4

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache cache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # Only 6.1+ uses the bazel build; persist the --disk_cache directory to speed up later builds
      - name: Restore bazel disk cache
        if: inputs.android_version != 'android12' && inputs.android_version != 'android13'
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-bazel-
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-bazel-
          
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      - name: Generate signing keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      - name: Configure Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"
          # Upstream git servers occasionally stall: abort if the transfer rate stays below 1KB/s for 180 seconds,
          # to avoid hanging indefinitely in repo sync / git clone until the job times out
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 180

      - name: Clone dependency repositories
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "Cloning AnyKernel3..."
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "Cloning SUSFS (branch: $SUSFS_BRANCH)..."
          # Automatically skip SUSFS when upstream has no matching SUSFS branch, to avoid breaking the build
          susfs_branch_missing() {
            if [ "$SKIP_INCOMPATIBLE" != "true" ]; then
              echo "::error::Upstream has no SUSFS branch $1"
              exit 1
            fi
            echo "::warning title=SUSFS skipped::Upstream has no SUSFS branch $1; SUSFS feature skipped"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> ⏭️ **SUSFS** skipped automatically: upstream has no $1 branch (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "SUSFS_SKIPPED=true" >> "$GITHUB_ENV"
            rm -rf susfs4ksu
            mkdir -p susfs4ksu
          }
          if [ "${{ inputs.enable_susfs }}" != "true" ]; then
            echo "SUSFS is disabled; skipping SUSFS repository clone"
            mkdir -p susfs4ksu
          elif [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ]; then
            if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
              echo "ShirkNeko repository has no branch $SUSFS_BRANCH; falling back to the original simonpunk repo..."
              git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" \
                || susfs_branch_missing "$SUSFS_BRANCH"
            fi
          else
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" \
              || susfs_branch_missing "$SUSFS_BRANCH"
          fi

          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ] && [ -d susfs4ksu/.git ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "Switching SUSFS to custom commit: $CUSTOM_COMMIT"
                cd susfs4ksu
                git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          if [ -d susfs4ksu/.git ]; then
            SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          else
            SUSFS_LATEST_COMMIT_DATE="Not enabled"
          fi
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS repository latest commit date: $SUSFS_LATEST_COMMIT_DATE"

          echo "Preparing patch resources..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "Using the current repository's patch directory: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      - name: Initialize and sync kernel source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "Initializing repo, branch: common-${FORMATTED_BRANCH}"

          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Detected deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          elif [[ -z "$REMOTE_BRANCH" ]]; then
            echo "Branch was deleted upstream: ${FORMATTED_BRANCH}; falling back to the latest ASB tag of that month"
            LATEST_R=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" \
              | grep -v '\^{}' \
              | sed 's/.*_r//' \
              | sort -n | tail -1)
            if [[ -z "$LATEST_R" ]]; then
              echo "::error::Neither the upstream branch nor the monthly tag exists: ${FORMATTED_BRANCH}"
              exit 1
            fi
            LATEST_TAG="${FORMATTED_BRANCH}_r${LATEST_R}"
            echo "Using tag: ${LATEST_TAG}"
            REMOTE_BRANCH="refs/tags/${LATEST_TAG}"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"refs\/tags\/${LATEST_TAG}\"/g" $DEFAULT_MANIFEST_PATH
          fi

          # repo sync supports resuming: each attempt is limited to 20 minutes; on timeout or failure, leftover processes are cleaned up and it retries,
          # and projects that already synced are skipped on the next attempt; this prevents a stalled upstream connection from consuming the whole job time limit
          SYNC_OK=false
          for SYNC_ATTEMPT in 1 2 3; do
            echo "==> repo sync attempt ${SYNC_ATTEMPT}/3"
            if timeout --kill-after=30 20m $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast; then
              SYNC_OK=true
              break
            fi
            # Recoverable retries only write to the log; three consecutive failures are still reported by the error annotation below
            echo "repo sync retry: attempt ${SYNC_ATTEMPT}/3 failed or timed out; cleaning up leftover git processes and retrying"
            pkill -9 -f 'git-remote-https' 2>/dev/null || true
            pkill -9 -f 'android\.googlesource\.com' 2>/dev/null || true
            sleep 10
          done
          if [ "$SYNC_OK" != "true" ]; then
            echo "::error::repo sync failed 3 consecutive attempts (upstream connection stalled or unavailable)"
            exit 1
          fi

          # Integrity guard: a resumed repo sync occasionally leaves an incompletely checked-out project, showing up as a directory
          # with only scattered files and missing BUILD files; the bazel loading phase then reports
          # "Every .bzl file must have a corresponding package".
          # Only check kleaf/BUILD.bazel (the Bazel package marker): a kleaf directory that exists without a BUILD file
          # always means an incomplete checkout. Do not check specific .bzl files — older branches (such as the
          # main-kernel-build-2023 used by 6.1) have kleaf directories that never contained the scripts added later, which would cause false alarms.
          for KLEAF_DIR in \
            prebuilts/clang/host/linux-x86/kleaf \
            build/kernel/kleaf; do
            if [ -d "$KLEAF_DIR" ] && [ ! -f "$KLEAF_DIR/BUILD.bazel" ]; then
              PROJECT_DIR="${KLEAF_DIR%/kleaf}"
              echo "::warning title=repo sync integrity guard::$KLEAF_DIR is missing BUILD.bazel, checkout incomplete; re-syncing $PROJECT_DIR"
              timeout --kill-after=30 20m $REPO sync -c --force-sync --fail-fast "$PROJECT_DIR" \
                || echo "::warning title=repo sync integrity guard::Re-sync of $PROJECT_DIR failed; continuing the build"
            fi
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

      - name: Extract actual sub-level
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "Actual sub-level: $ACTUAL_SUBLEVEL"
          if [[ "${{ inputs.sub_level }}" == "X" ]]; then
            CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${ACTUAL_SUBLEVEL}"
            echo "CONFIG=$CONFIG" >> $GITHUB_ENV
            NAME_SUBLEVEL="$ACTUAL_SUBLEVEL"
            echo "LTS build: artifact naming uses the actual sub-level $ACTUAL_SUBLEVEL"
          else
            NAME_SUBLEVEL="${{ inputs.sub_level }}"
          fi
          echo "NAME_SUBLEVEL=$NAME_SUBLEVEL" >> $GITHUB_ENV

      # Decide based on the actual SUBLEVEL after sync, to avoid re-patching LTS kernels that already include the upstream fix
      - name: Automatically apply the CVE-2026-43499 rtmutex fix chain
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if ! bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "${{ inputs.kernel_version }}" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=CVE-2026-43499 skipped::Fix chain failed to apply (possibly incompatible with the current kernel sub-level); feature skipped and build continues"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **CVE-2026-43499 fix chain** skipped automatically: fix chain failed to apply (possibly incompatible with the current kernel sub-level) (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "CVE_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::CVE-2026-43499 fix chain failed to apply"
            exit 1
          fi

      - name: Fix glibc 2.38 compatibility
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # On glibc 2.38+, libsubcmd compiled with -D_GNU_SOURCE redirects the strtol family to
          # __isoc23_strtol; when the old tools/bpf/resolve_btfids/Makefile builds subcmd it
          # does not pass the kernel-side CFLAGS (the build uses system headers, and linking against the old toolchain reports undefined
          # symbol). Detect and fix based on whether the Makefile is still in the old format (the subcmd build line has no
          # EXTRA_CFLAGS), rather than guessing the upstream backport point from the sub-level,
          # so older branches such as android14-5.15.110 are matched as well.
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')

          if grep -q '\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=' tools/bpf/resolve_btfids/Makefile 2>/dev/null \
            && [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            echo "Applying glibc 2.38 compatibility fix..."
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
            fi
          fi

      - name: Add OnePlus Snapdragon 8 Elite/Gen5 processor support
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "Using this repository's hmbird_patch.c..."
          cp "$GITHUB_WORKSPACE/hmbird_patch.c" ./hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile

      - name: Determine KernelSU branch
        id: ksu-branch
        if: inputs.ksu_mode != 'Disable KSU'
        run: |
          variant_input="${{ inputs.ksu_variant }}"

          case "$variant_input" in
            "BakaSU")
              BRANCH="-s main"
              ;;
            "FinaSU")
              BRANCH="-s master"
              ;;
            "SukiSU-Nova")
              if [ "${{ inputs.enable_susfs }}" = "false" ]; then
                BRANCH="-s main"
              else
                BRANCH="-s builtin"
              fi
              ;;
            *)
              echo "Unknown variant: $variant_input" >&2
              exit 1
              ;;
          esac

          # Check for a custom commit (only applies to SukiSU-Nova)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU-Nova" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU-Nova using custom commit: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU branch: $BRANCH"

      - name: Add KernelSU
        if: inputs.ksu_mode != 'Disable KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          KSU_COMMIT: ${{ inputs.ksu_commit }}
          KSU_CERT_SIZE: ${{ inputs.ksu_cert_size }}
          KSU_CERT_HASH: ${{ inputs.ksu_cert_hash }}
        run: |
          case "${{ inputs.ksu_variant }}" in
            "SukiSU-Nova")
              echo "Adding ${{ inputs.ksu_variant }}..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Nova/SukiSU-Nova/main/kernel/setup.sh" | bash $BRANCH
              # Kernel-side KSU version source aligned with the latest officially uploaded Manager build:
              # SukiSU-Nova version = 30000 + commit count of the branch REPO_BRANCH points to - 4001
              # (the main branch is defined in kernel/Kbuild, the builtin branch in kernel/Makefile;
              #  prefer the GitHub API, fall back to a local rev-list). Rewrite REPO_BRANCH to the official
              # build commit so the kernel KSU version matches the fetched manager package exactly
              if [ -n "$KSU_COMMIT" ] && [ "$BRANCH" != "-s main" ] && [ "$BRANCH" != "-s builtin" ]; then
                echo "SukiSU-Nova using custom commit ($BRANCH); skipping manager version alignment"
              elif [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU fetch origin "$KSU_COMMIT" 2>/dev/null; then
                  echo "Official build commit $KSU_COMMIT already exists in the local clone; skipping fetch"
                fi
                if ! git -C KernelSU cat-file -e "$KSU_COMMIT^{commit}" 2>/dev/null; then
                  echo "::error::Official build commit $KSU_COMMIT is not in the KernelSU repository; cannot align the version source"
                  exit 1
                fi
                if [ "$BRANCH" = "-s builtin" ]; then
                  KSU_VERSION_SOURCE="KernelSU/kernel/Makefile"
                else
                  KSU_VERSION_SOURCE="KernelSU/kernel/Kbuild"
                fi
                if ! sed -i -E "s|^(REPO_BRANCH[[:space:]]*[:?+]?=)[[:space:]]*main[[:space:]]*\$|\1 $KSU_COMMIT|" "$KSU_VERSION_SOURCE"; then
                  echo "::error::Failed to rewrite REPO_BRANCH in $KSU_VERSION_SOURCE; cannot align the manager version"
                  exit 1
                fi
                if ! grep -qE "^REPO_BRANCH[[:space:]]*[:?+]?=[[:space:]]*$KSU_COMMIT[[:space:]]*\$" "$KSU_VERSION_SOURCE"; then
                  echo "::error::Could not align REPO_BRANCH in $KSU_VERSION_SOURCE (the upstream structure may have changed); cannot align the manager version"
                  exit 1
                fi
                echo "SukiSU-Nova kernel-side version source aligned to the official uploaded build commit $KSU_COMMIT (KSU version $((30000 + $(git -C KernelSU rev-list --count "$KSU_COMMIT") - 4001)))"
              fi
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU sukisu
              ;;
            "BakaSU")
              echo "Adding BakaSU..."
              curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash $BRANCH
              # Kernel-side KernelSU is checked out at the same commit as the latest officially uploaded Manager build
              # (Kbuild computes the version as 30700 + git commit count, from the same source and with the same value as the official manager versionCode),
              # so the kernel KSU version matches the fetched manager package exactly
              if [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
                  git -C KernelSU fetch origin "$KSU_COMMIT"
                  git -C KernelSU checkout --detach "$KSU_COMMIT"
                fi
                if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
                  echo "::error::Failed to check out KernelSU at the official build commit $KSU_COMMIT; cannot align the manager version"
                  exit 1
                fi
                echo "KernelSU checked out at the official uploaded build commit $KSU_COMMIT (KSU version $((30700 + $(git -C KernelSU rev-list --count HEAD))))"
              fi
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU bakasu
              ;;
            "FinaSU")
              echo "Adding ${{ inputs.ksu_variant }}..."
              git clone https://github.com/LyraVoid/FinaSU.git KernelSU
              # Kernel side is checked out at the commit selected by get-manager: for the Release channel it is the Release tag commit,
              # for the Latest channel it is the latest build commit of build-manager.yml; Kbuild computes the version as 30000 + git
              # commit count, from the same source and with the same value as the corresponding manager versionCode
              if [ -n "$KSU_COMMIT" ]; then
                if ! git -C KernelSU checkout --detach "$KSU_COMMIT" 2>/dev/null; then
                  git -C KernelSU fetch origin "$KSU_COMMIT"
                  git -C KernelSU checkout --detach "$KSU_COMMIT"
                fi
                if [ "$(git -C KernelSU rev-parse HEAD)" != "$KSU_COMMIT" ]; then
                  echo "::error::Failed to check out KernelSU at the official build commit $KSU_COMMIT; cannot align the manager version"
                  exit 1
                fi
                echo "KernelSU checked out at the official uploaded build commit $KSU_COMMIT (KSU version $((30000 + $(git -C KernelSU rev-list --count HEAD))))"
              fi
              # FinaSU's bundled kernel/setup.sh still clones upstream tiann/KernelSU, so do it manually here
              # in-tree integration: symlink the driver directory and hook up Makefile / Kconfig
              DRIVER_DIR="$KERNEL_ROOT/common/drivers"
              ln -sfn "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_ROOT/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
              grep -q "obj-.*CONFIG_KSU.*kernelsu/" "$DRIVER_DIR/Makefile" || \
                echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$DRIVER_DIR/Makefile"
              if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"; then
                sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"
              fi
              # SUSFS scenario: upstream already integrates it natively in-tree, so no driver-side patch is needed,
              # and scripts/susfs_fixes/apply.sh validates and applies the main kernel-side patch in one place

              # Inject the FinaSU official manager signing certificate into the kernel's second trust slot (EXPECTED_SIZE2/HASH2).
              # Without injection the kernel only trusts the upstream KernelSU default slot, the official KernelSU manager would take over the
              # manager identity, and the FinaSU manager would show "Not installed".
              if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
                echo "Manager certificate was not passed in by get-manager; falling back to extracting it from the latest FinaSU Release APK..."
                REL_APK=$(mktemp -d)/manager.apk
                REL_JSON=""
                for ATTEMPT in 1 2 3; do
                  REL_JSON=$(curl -s --fail --max-time 30 \
                    "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") \
                    && [ -n "$REL_JSON" ] && break
                  echo "Failed to fetch Release info, retrying ($ATTEMPT/3)..."
                  sleep 5
                done
                REL_URL=$(printf '%s' "$REL_JSON" | python3 -c \
                  "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.apk')))" 2>/dev/null || true)
                if [ -z "$REL_URL" ]; then
                  echo "::error::Cannot obtain the FinaSU manager signing certificate: get-manager did not pass it and the latest Release has no APK asset, so the FinaSU manager will not be recognized by the kernel"
                  exit 1
                fi
                curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_URL" || {
                  echo "::error::Failed to download the FinaSU Release APK; cannot extract the manager signing certificate"
                  exit 1
                }
                CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
                KSU_CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
                KSU_CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
              fi
              if [ -z "$KSU_CERT_SIZE" ] || [ -z "$KSU_CERT_HASH" ]; then
                echo "::error::Failed to extract the FinaSU manager signing certificate; the FinaSU manager will not be recognized by the kernel"
                exit 1
              fi
              echo "Injecting the FinaSU manager signing certificate into the kernel's second trust slot: size=$KSU_CERT_SIZE sha256=$KSU_CERT_HASH"
              awk -v size="$KSU_CERT_SIZE" -v hash="$KSU_CERT_HASH" '
                !done && /^ccflags-y \+= -DEXPECTED_HASH=/ {
                  print
                  print "# injected by GKI_FinaSU_SUSFS: trust the official FinaSU manager via the second signature slot"
                  print "KSU_EXPECTED_SIZE2 := " size
                  print "KSU_EXPECTED_HASH2 := " hash
                  print "KSU_SECOND_SIGNATURE_RELEASE := 1"
                  done = 1
                  next
                }
                { print }
              ' KernelSU/kernel/Kbuild > KernelSU/kernel/Kbuild.new && mv KernelSU/kernel/Kbuild.new KernelSU/kernel/Kbuild
              grep -q "^KSU_EXPECTED_SIZE2 := " KernelSU/kernel/Kbuild \
                && grep -q "^KSU_EXPECTED_HASH2 := " KernelSU/kernel/Kbuild \
                && grep -q "^KSU_SECOND_SIGNATURE_RELEASE := 1" KernelSU/kernel/Kbuild \
                || { echo "::error::Kbuild injection failed (anchor line missing; the FinaSU upstream Kbuild structure may have changed)"; exit 1; }
              # Consistent with SukiSU-Nova/BakaSU: the @<branch> in the full kernel version is fixed to the brand name
              # (CI checks out a detached commit, where abbrev-ref shows @HEAD);
              # must be called after the certificate injection above (awk rewrites Kbuild)
              bash "$GITHUB_WORKSPACE/scripts/ksu_post_setup.sh" KernelSU finasu
              ;;
            *)
              echo "Unknown variant: ${{ inputs.ksu_variant }}" >&2
              exit 1
              ;;
          esac

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          else
            echo "KSU_LATEST_COMMIT_DATE=Unknown" >> $GITHUB_ENV
          fi

      - name: Compute AnyKernel3 naming version
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          KSU_VERSION=""
          if [ -n "${{ inputs.ksu_commit }}" ] && [ -d KernelSU/.git ]; then
            KSU_COUNT=$(git -C KernelSU rev-list --count "${{ inputs.ksu_commit }}" 2>/dev/null || echo "")
            if [ -n "$KSU_COUNT" ]; then
              case "${{ inputs.ksu_variant }}" in
                SukiSU-Nova) KSU_VERSION=$((30000 + KSU_COUNT - 4001)) ;;
                BakaSU) KSU_VERSION=$((30700 + KSU_COUNT)) ;;
                FinaSU) KSU_VERSION=$((30000 + KSU_COUNT)) ;;
              esac
            fi
          fi
          if [ "${{ inputs.ksu_mode }}" = "Disable KSU" ]; then
            AK3_NAME="KSU-free-${CONFIG}"
          elif [ -n "$KSU_VERSION" ]; then
            AK3_NAME="${{ inputs.ksu_variant }}-${KSU_VERSION}-${CONFIG}"
          else
            AK3_NAME="${{ inputs.ksu_variant }}_kernel-${CONFIG}"
          fi
          echo "AK3_NAME=$AK3_NAME" >> $GITHUB_ENV
          echo "AnyKernel3 name: $AK3_NAME"

      # FinaSU's kernel-side SUSFS integration has been merged into scripts/susfs_fixes/apply.sh:
      # since 5b83330b (2026-10-23) upstream integrates SUSFS natively in-tree, in the same
      # "no driver-side patch" form as SukiSU-Nova/BakaSU, validated and applied together by the "Apply SUSFS patch" step

      # SukiSU-Nova's builtin branch (built-in + SUSFS product line) and main branch are independent of each other,
      # and the official manager APK is always built from the main branch. When main raises
      # KERNEL_SU_UAPI_VERSION (e.g. 3b60791 UAPI 6 added
      # KSU_IOCTL_LOOKUP_SYMBOLS + KSU_GET_INFO_FLAG_PREINIT), the kernel UAPI
      # of the builtin checkout falls behind the manager, and the home page reports "Kernel update required"
      # (Natives.kt: managerUAPIVersion > kernelUAPIVersion).
      # This step syncs dynamically: it reads the official main uapi/supercall.h, ports the missing constants/structs
      # into the builtin checkout verbatim from main and raises the UAPI number; when UAPI >= 6 it also
      # injects the LOOKUP_SYMBOLS handler + symbol_resolver kernel-side capability;
      # it is skipped automatically once upstream builtin syncs on its own; see scripts/ksu_uapi_sync/sync_uapi.sh
      - name: Sync SukiSU-Nova kernel UAPI version (align with the official manager)
        if: inputs.ksu_variant == 'SukiSU-Nova' && inputs.ksu_mode != 'Disable KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: bash "$GITHUB_WORKSPACE/scripts/ksu_uapi_sync/sync_uapi.sh" KernelSU

      # The hook/lsm_hook.c of the SukiSU-Nova builtin branch still calls
      # security_add_hooks(hooks, count, "ksu") with the old signature; 6.8+ kernels require const struct lsm_id *,
      # so the android16-6.12 GKI build fails outright.
      # The patch is guarded internally by LINUX_VERSION_CODE, so behavior is unchanged on kernels 6.7 and below,
      # and it is skipped automatically by content detection once SukiSU-Nova fixes this upstream.
      - name: Apply SukiSU-Nova kernel API compatibility patch (6.8+ lsm_id)
        if: inputs.ksu_variant == 'SukiSU-Nova' && inputs.ksu_mode != 'Disable KSU'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: bash "$GITHUB_WORKSPACE/scripts/sukisu_compat/apply.sh" KernelSU

      - name: Apply SUSFS patch
        if: inputs.enable_susfs && env.SUSFS_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
        run: bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"
          
      - name: Clone Droidspaces patch repository
        if: inputs.droidspaces != 'off'
        run: |
          if git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS; then
            echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV
          elif [ "$SKIP_INCOMPATIBLE" = "true" ]; then
            echo "::warning title=Droidspaces skipped::Failed to clone the Droidspaces patch repository; Droidspaces feature skipped"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> ⏭️ **Droidspaces (virtualization support)** skipped automatically: failed to clone the patch repository (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "DROIDSPACES_SKIPPED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Failed to clone the Droidspaces patch repository"
            exit 1
          fi

      - name: Back up baseline defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Integrate NoMount mount meta-module
        if: inputs.use_nomount
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # NoMount registers its subsystem at the fs/ layer and does not depend on traditional mount points, so it can coexist with any KSU variant and SUSFS.
          # CONFIG_NOMOUNT must be appended after "Back up baseline defconfig" so that the 6.1+ bazel fragment can capture it.
          set -euo pipefail
          NOMOUNT_SETUP_URL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"

          nomount_cleanup() {
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "$NOMOUNT_SETUP_URL" \
              | bash -s -- --cleanup >/dev/null 2>&1 || true
          }
          nomount_fail() {
            nomount_cleanup
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=NoMount skipped::$1; NoMount meta-module integration skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **NoMount meta-module** skipped automatically: $1 (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "NOMOUNT_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          echo "Fetching and running the NoMount upstream integration script (dev)..."
          if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$NOMOUNT_SETUP_URL" | bash -s -- dev; then
            nomount_fail "NoMount integration script failed"
          fi
          [ -L "fs/nomount" ] || nomount_fail "fs/nomount symlink is missing after NoMount integration"
          grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || nomount_fail "fs/Kconfig is not registered after NoMount integration"
          echo "NoMount integration complete, commit: $(git -C NoMount rev-parse HEAD)"

          if ! grep -q '^CONFIG_NOMOUNT=y' "$DEFCONFIG"; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_NOMOUNT=y enabled"
          else
            echo "CONFIG_NOMOUNT=y already present; skipping"
          fi

      - name: Integrate Droidspaces support
        if: inputs.droidspaces != 'off' && env.DROIDSPACES_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          KERNEL_VER="${{ inputs.kernel_version }}"
          SLOT="${{ inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "Applying the Droidspaces SYSVIPC kABI fix patch (slot: $SLOT / $SLOT_NAME)..."
          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "::warning::Droidspaces: unsupported kernel version $KERNEL_VER; skipping patch"
              exit 0
              ;;
          esac
          if [ ! -f "$PATCH_FILE" ]; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=Droidspaces skipped::Patch file $PATCH_FILE not found; Droidspaces feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **Droidspaces (virtualization support)** skipped automatically: patch file $PATCH_FILE not found (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "DROIDSPACES_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Droidspaces patch file not found: $PATCH_FILE"
            exit 1
          fi
          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::SYSVIPC kABI patch failed to apply; it may already be applied or the context does not match"
          fi

          # 5.10 and below also need the POSIX_MQUEUE kABI fix
          if [ "$KERNEL_VER" = "5.10" ]; then
            echo "Applying the Droidspaces POSIX_MQUEUE kABI fix patch (5.10)..."
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if ! patch -p1 --forward < "$POSIX_PATCH"; then
              echo "::warning::POSIX_MQUEUE kABI patch failed to apply; it may already be applied or the context does not match"
            fi
          fi

          # On Android 16 / 6.12, rust_binder.ko references
          # init_ipc_ns and put_ipc_ns once IPC_NS is enabled, but the current AOSP common branch does not export these two symbols yet.
          # Add the exports here so modpost does not fail on undefined symbols.
          if [ "$KERNEL_VER" = "6.12" ]; then
            if [ -f "ipc/msgutil.c" ] && ! grep -qF 'EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"; then
              sed -i '/^struct msg_msgseg {/i EXPORT_SYMBOL(init_ipc_ns);' "ipc/msgutil.c"
              echo "Added symbol export for init_ipc_ns"
            fi

            if [ -f "ipc/namespace.c" ] && ! grep -qF 'EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"; then
              sed -i '/^static struct ns_common \*ipcns_get(/i EXPORT_SYMBOL(put_ipc_ns);' "ipc/namespace.c"
              echo "Added symbol export for put_ipc_ns"
            fi
          fi

          echo "Adding Droidspaces kernel config..."
          # Process each one per the documented rules: skip if already enabled, replace if "# not set", append if absent
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  Already enabled: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  Switched: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  Added: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  Not defined in the current kernel: $cfg, skipping"
            fi
          }

          # Required config
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS

          # Optional: network-related config (Docker/NAT mode)
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET

          # The symbol name of the REJECT target may differ across kernel versions; enable whichever config actually exists
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

          echo "Droidspaces integration complete"

          echo "GKI6.6 networking config for regular users (Droidspaces)"
          # Specifically handle =n type configs (Android network permissions must be turned off)
          disable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=n" "$DEFCONFIG"; then
              echo "  Disabled: $cfg"
            elif grep -q "^${cfg}=y" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=y$/${cfg}=n/" "$DEFCONFIG"
              echo "  Turned off: $cfg"
            else
              echo "# ${cfg} is not set" >> "$DEFCONFIG"
              echo "  Added and disabled: $cfg"
            fi
          }

          if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
            # 1. Enable user namespaces (required)
            # enable_config_if_defined CONFIG_USER_NS
            # 2. Turn off Android strict network control (required)
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

      - name: Inject NTSync kernel config
        if: inputs.droidspaces != 'off' && inputs.droidspaces_ntsync && env.DROIDSPACES_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e
          echo "=== Starting NTSync kernel patch injection ==="
          echo "Android version: ${{ inputs.android_version }}"
          echo "Kernel version: ${{ inputs.kernel_version }}"

          case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "::warning::NTSync: ${{ inputs.android_version }} / ${{ inputs.kernel_version }} not supported; skipping patch"
              exit 0
              ;;
          esac

          ntsync_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=NTSync skipped::$1; NTSync feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **NTSync** skipped automatically: $1 (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "NTSYNC_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          NTSYNC_PATCH_URL="https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync"
          NTSYNC_COMPAT_HEADER="$GITHUB_WORKSPACE/scripts/ntsync_compat/ntsync_lockdep_compat.h"

          # Platform wiring: Kconfig/Makefile are written directly and idempotently.
          # The upstream platform patch mixes "wiring" and the "lockdep backport" in one patch, so any context drift fails the whole step;
          # the wiring itself is only two lines, and writing it separately makes it independent of the upstream patch context.
          ntsync_wire_misc() {
            if ! grep -q '^config NTSYNC$' drivers/misc/Kconfig; then
              awk '
                !done && /^endmenu$/ {
                  print "config NTSYNC"
                  print "\ttristate \"NT synchronization primitive emulation\""
                  print "\tdefault\tm"
                  print "\thelp"
                  print "\t  This module provides kernel support for emulation of Windows NT"
                  print "\t  synchronization primitives. It is not a hardware driver."
                  print ""
                  print "\t  To compile this driver as a module, choose M here: the"
                  print "\t  module will be called ntsync."
                  print ""
                  print "\t  If unsure, say N."
                  print ""
                  done = 1
                }
                { print }
              ' drivers/misc/Kconfig > drivers/misc/Kconfig.ntsync &&
                mv drivers/misc/Kconfig.ntsync drivers/misc/Kconfig
            else
              # If it exists but is marked BROKEN (6.12 mainline), remove the dependency, otherwise the symbol is never visible.
              ntsync_strip_broken
            fi

            if ! grep -Fq 'obj-$(CONFIG_NTSYNC)' drivers/misc/Makefile; then
              printf 'obj-$(CONFIG_NTSYNC)\t\t+= ntsync.o\n' >> drivers/misc/Makefile
            fi

            ntsync_wired
          }

          # lockdep compatibility layer: lockdep_assert()/LOCK_STATE_* were only introduced in v5.13.
          # The include/linux/lockdep.h hunk of the upstream platform patch expects lockdep_assert_none_held_once() (v5.13+),
          # so it is bound to be rejected on 5.10, while kernel/locking/lockdep.c still gets modified — a half-applied kernel will not compile at all.
          # Here we only add the two symbols the driver actually uses, without touching kernel core locking code; semantics match upstream.
          ntsync_inject_lockdep_compat() {
            cp "$NTSYNC_COMPAT_HEADER" drivers/misc/ntsync_lockdep_compat.h
            if ! grep -q 'ntsync_lockdep_compat.h' drivers/misc/ntsync.c; then
              sed -i 's|^#define NTSYNC_NAME|#include "ntsync_lockdep_compat.h"\n\n#define NTSYNC_NAME|' drivers/misc/ntsync.c
            fi
            grep -q 'ntsync_lockdep_compat.h' drivers/misc/ntsync.c
          }

          ntsync_has_lockdep_api() {
            grep -q 'define lockdep_assert(' include/linux/lockdep.h &&
              grep -q 'LOCK_STATE_NOT_HELD' include/linux/lockdep.h
          }

          # 6.12 mainline already ships the NTSYNC sources, but Kconfig marks it depends on BROKEN,
          # so it cannot count as "integrated"; otherwise CONFIG_NTSYNC=y in the defconfig would be dropped by Kconfig.
          ntsync_kconfig_block() {
            awk '
              /^config NTSYNC$/ { inblk = 1; print; next }
              inblk && /^(config |menuconfig |endmenu|source |menu )/ { exit }
              inblk { print }
            ' drivers/misc/Kconfig
          }

          ntsync_kconfig_wired() {
            grep -q '^config NTSYNC$' drivers/misc/Kconfig &&
              ! ntsync_kconfig_block |
                grep -q '^[[:space:]]*depends on[[:space:]]*BROKEN[[:space:]]*$'
          }

          ntsync_strip_broken() {
            grep -q '^config NTSYNC$' drivers/misc/Kconfig || return 0
            awk '
              /^config NTSYNC$/ { inblk = 1; print; next }
              inblk && /^(config |menuconfig |endmenu|source |menu )/ { inblk = 0 }
              inblk && /^[[:space:]]*depends on[[:space:]]*BROKEN[[:space:]]*$/ { next }
              { print }
            ' drivers/misc/Kconfig > drivers/misc/Kconfig.ntsync &&
              mv drivers/misc/Kconfig.ntsync drivers/misc/Kconfig
          }

          ntsync_wired() {
            ntsync_kconfig_wired &&
              grep -Fq 'obj-$(CONFIG_NTSYNC)' drivers/misc/Makefile
          }

          if [[ -f drivers/misc/ntsync.c && -f include/uapi/linux/ntsync.h ]]; then
            echo "NTSync sources already exist (shipped in mainline); skipping the base patch"
          elif [[ ! -e drivers/misc/ntsync.c && ! -e include/uapi/linux/ntsync.h ]]; then
            wget -q "${NTSYNC_PATCH_URL}/ntsync_base.patch" ||
              ntsync_fail "Failed to download the NTSync base patch"
            patch --batch --forward -p1 < ntsync_base.patch ||
              ntsync_fail "Failed to apply the NTSync base patch (possibly incompatible with the current kernel)"
          else
            ntsync_fail "NTSync sources are incomplete (driver and uapi header do not match)"
          fi

          # Platform patch: sources, Kconfig/Makefile wiring and lockdep API must all be present to count as integrated.
          if ntsync_wired && ntsync_has_lockdep_api; then
            echo "NTSync already integrated; skipping the platform patch"
          else
            wget -q "${NTSYNC_PATCH_URL}/${NTSYNC_PATCH}.patch" ||
              ntsync_fail "Failed to download NTSync platform patch ${NTSYNC_PATCH}.patch"

            # Dry-run first: if the patch is applied only partially (lockdep.c changed but lockdep.h not), the kernel cannot compile,
            # so only apply for real when it can be applied completely; otherwise fall back to local wiring / the compatibility layer as a whole.
            if patch --batch --forward --dry-run -p1 < "${NTSYNC_PATCH}.patch" > /tmp/ntsync_platform.log 2>&1; then
              echo "Upstream platform patch can be applied completely; applying it (including the lockdep backport)"
              patch --batch --forward -p1 < "${NTSYNC_PATCH}.patch" ||
                ntsync_fail "Failed to apply the NTSync platform patch (possibly incompatible with the current kernel)"
            else
              echo "::notice title=NTSync compat layer::Upstream platform patch context does not match; using local wiring instead (functionally equivalent)"
              sed -n '1,30p' /tmp/ntsync_platform.log
              EXTRA_FILES=$(grep '^diff --git' "${NTSYNC_PATCH}.patch" |
                grep -v 'drivers/misc/Kconfig' | grep -v 'drivers/misc/Makefile' |
                grep -v 'include/linux/lockdep.h' | grep -v 'kernel/locking/lockdep.c' || true)
              if [ -n "$EXTRA_FILES" ]; then
                echo "::warning title=NTSync compat layer::The platform patch also contains unsupported changes, which were skipped: $EXTRA_FILES"
              fi
              ntsync_wire_misc || ntsync_fail "Failed to write NTSync platform wiring"
              if ntsync_has_lockdep_api; then
                echo "Kernel already provides lockdep_assert()/LOCK_STATE_*; lockdep compatibility layer not needed"
              else
                ntsync_inject_lockdep_compat || ntsync_fail "Failed to inject the NTSync lockdep compatibility layer"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "> 🔧 **NTSync**: the upstream platform patch does not match this kernel's context; the local lockdep compatibility layer is enabled (functionally equivalent, build continues)" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            fi
          fi

          # Fallback: in some versions the platform patch only changes Kconfig (e.g. 6.12 only removes BROKEN); Makefile wiring must be ensured here.
          ntsync_wired || ntsync_wire_misc || ntsync_fail "NTSync platform wiring is incomplete (Kconfig/Makefile)"

          cd ..

          # Config path
          CONFIG_PATH="./common/arch/arm64/configs/gki_defconfig"
          echo "Checking and enabling CONFIG_NTSYNC..."

          # Remove the disabled marker, then append the enabled entry, so repeated runs stay idempotent.
          sed -i '/CONFIG_NTSYNC is not set/d' "$CONFIG_PATH"
          if ! grep -q "^CONFIG_NTSYNC=y" "$CONFIG_PATH"; then
            echo "CONFIG_NTSYNC=y" >> "$CONFIG_PATH"
            echo "✅ CONFIG_NTSYNC enabled successfully"
          else
            echo "✅ CONFIG_NTSYNC is already enabled"
          fi

          echo "=== NTSync patch and config injection complete ==="

      - name: Apply Unicode bypass fix
        if: inputs.enable_susfs && env.SUSFS_SKIPPED != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

          # When the main SUSFS patch or upstream ASB already contains the same fs/unicode change, the hunks of the bypass patch
          # are judged by patch as previously applied: the source state is correct (it compiles fine), but the hunks
          # are still written to .rej and pollute the Rejects artifact. The expected conflict is removed here;
          # if mkutf8data.c still contains ignore_init, something is genuinely missing, so the .rej is kept for troubleshooting.
          if [ -f fs/unicode/mkutf8data.c.rej ] && [ -f fs/unicode/mkutf8data.c ] \
            && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "fs/unicode .rej is the expected conflict from an already-applied identical change; removing it (build not affected)"
            rm -f fs/unicode/*.rej
          fi

      - name: Configure ZRAM LZ4 patch stack
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 6.12 and above have no upstream ZRAM patch source yet; skip directly, so it is not treated as a missing resource that aborts the build
          case "${{ inputs.kernel_version }}" in
            6.12|6.18)
              echo "::warning title=ZRAM skipped::Kernel ${{ inputs.kernel_version }} has no ZRAM patch source yet; ZRAM feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **ZRAM / LZ4KD** skipped: kernel ${{ inputs.kernel_version }} has no ZRAM patch source yet (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "ZRAM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          # Pre-check: all patch resources must exist; if any is missing, handle it per the skip-incompatible policy, to avoid failing halfway through the modifications
          # Version patch source: SukiSU_patch/other/zram/zram_patch/<ver>
          pick_zram_patch() {
            local name="$1"
            local path="$SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/$name"
            if [ -f "$path" ]; then
              echo "$path"
            else
              echo ""
            fi
          }
          LZ4KD_PATCH=$(pick_zram_patch lz4kd.patch)
          LZ4K_OPLUS_PATCH=$(pick_zram_patch lz4k_oplus.patch)

          MISSING=""
          [ -d "$ZZH_PATCHES/zram/lz4" ] || MISSING="$MISSING zram/lz4"
          [ -f "$ZZH_PATCHES/zram/apply_lz4_neon.sh" ] || MISSING="$MISSING zram/apply_lz4_neon.sh"
          [ -d "$ZZH_PATCHES/zram/include/linux" ] || MISSING="$MISSING zram/include/linux"
          [ -d "$SUKISU_PATCHES/other/zram/lz4k" ] || MISSING="$MISSING SukiSU_patch/other/zram/lz4k"
          [ -d "$SUKISU_PATCHES/other/zram/lz4k_oplus" ] || MISSING="$MISSING SukiSU_patch/other/zram/lz4k_oplus"
          [ -n "$LZ4KD_PATCH" ] || MISSING="$MISSING SukiSU_patch/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch"
          [ -n "$LZ4K_OPLUS_PATCH" ] || MISSING="$MISSING SukiSU_patch/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch"
          if [ -n "$MISSING" ]; then
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=ZRAM skipped::Missing ZRAM patch resources: $MISSING; ZRAM feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **ZRAM / LZ4KD** skipped automatically: missing ZRAM patch resources: $MISSING (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "ZRAM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Missing ZRAM patch resources: $MISSING"
            exit 1
          fi

          zram_step_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=ZRAM skipped::$1; ZRAM feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **ZRAM / LZ4KD** skipped automatically: $1 (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "ZRAM_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          echo "Upgrading LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          if ! bash $ZZH_PATCHES/zram/apply_lz4_neon.sh; then
            zram_step_fail "apply_lz4_neon.sh failed"
          fi

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp "$LZ4KD_PATCH" ./lz4kd.patch
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch failed to apply; it may already be applied or the context does not match"
          fi

          cp "$LZ4K_OPLUS_PATCH" ./lz4k_oplus.patch
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch failed to apply; it may already be applied or the context does not match"
          fi

      - name: Fix 6.6 WiFi/Bluetooth compatibility (Samsung + Xiaomi)
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              if [ "$SKIP_INCOMPATIBLE" != "true" ]; then
                echo "::error::File does not exist: $file"
                exit 1
              fi
              echo "::warning title=min_kdp skipped::File does not exist: $file"
              return 0
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          if [ ! -f "$MIN_KDP_PATCH" ]; then
            if [ "$SKIP_INCOMPATIBLE" != "true" ]; then
              echo "::error::Patch does not exist: $MIN_KDP_PATCH"
              exit 1
            fi
            echo "::warning title=min_kdp skipped::Patch does not exist: $MIN_KDP_PATCH"
            exit 0
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "The min_kdp symbols patch is already applied or the current context does not match; skipping."
          fi

          if [ ! -f "$MIN_KDP_SRC" ]; then
            if [ "$SKIP_INCOMPATIBLE" != "true" ]; then
              echo "::error::File does not exist: $MIN_KDP_SRC"
              exit 1
            fi
            echo "::warning title=min_kdp skipped::File does not exist: $MIN_KDP_SRC"
            exit 0
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      - name: Configure ZRAM options
        if: inputs.use_zram && env.ZRAM_SKIPPED != 'true'
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ] || [ "${{ inputs.android_version }}" = "android16" ] || [ "${{ inputs.android_version }}" = "android17" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            # ZRAM_BACKEND_* is only declared in the 6.12+ Kconfig; the kernel_config of the bazel build
            # validates that every config item in the fragment exists in Kconfig, and on older kernels
            # these lines would cause a compile failure outright, so they must be stripped below 6.12
            if [ "$(printf '%s\n' "6.12" "${{ inputs.kernel_version }}" | sort -V | head -1)" = "6.12" ]; then
              cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
            else
              grep -v '^CONFIG_ZRAM_BACKEND_' "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
            fi
          fi

      - name: Add BBG baseband protection patch
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          bbg_fail() {
            # Roll back a half-finished installation, so leftover references do not break the compile
            sh /tmp/bbg_setup.sh --cleanup >/dev/null 2>&1 || true
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=BBG skipped::$1; BBG baseband protection feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **BBG baseband protection** skipped automatically: $1 (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "BBG_SKIPPED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          if ! wget -qO /tmp/bbg_setup.sh https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh; then
            bbg_fail "Failed to download the BBG install script"
          fi
          if ! sh /tmp/bbg_setup.sh; then
            bbg_fail "BBG install script failed"
          fi
          if [ ! -f common/security/baseband-guard/Kconfig ] || ! grep -q 'baseband-guard' common/security/Makefile; then
            bbg_fail "BBG install result validation failed (possibly incompatible with the current kernel directory structure)"
          fi

          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

          # BBG blkdev_helper.c only includes <linux/blkdev.h>, but blkdev_get_no_open/
          # blkdev_put_no_open were moved into the private header block/blk.h in Linux 6.9+ (two-argument
          # form from 6.15+), causing android17-6.18 to report implicit declarations when compiling; a compatibility patch is applied based on the actual header contents
          bash "$GITHUB_WORKSPACE/scripts/bbg_fixes/fix_blkdev_helper.sh" common

      - name: Apply network enhancements (BBRv3 / IPSet / Qdisc / CIFS)
        if: inputs.use_net_enhance
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          net_fail() {
            if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
              echo "::warning title=Network enhancements skipped::$1; network enhancement feature skipped"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **Network enhancements (BBRv3 / IPSet / Qdisc / CIFS)** skipped automatically: $1 (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "NET_ENHANCE_SKIPPED=true" >> "${GITHUB_ENV:-/dev/null}"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          echo "=== Applying network enhancements (BBRv3 / IPSet / Qdisc / CIFS) ==="
          BBR3_DIR="$KERNEL_PATCHES/common/bbrv3"
          KVER="${{ inputs.kernel_version }}"
          AVER="${{ inputs.android_version }}"

          # ---------- BBRv3 patch: dispatched by version (from WildKernels/kernel_patches) ----------
          case "$AVER-$KVER" in
            android12-5.10) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch" ;;
            android13-5.15) BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android13-5.15.patch" ;;
            android14-6.1)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" ;;
            android15-6.6)  BBR3_PATCH="$BBR3_DIR/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch" ;;
            *) BBR3_PATCH="" ;;
          esac

          # android16-6.12 has no backport patch; only baseline BBR v1 is kept
          if [ -n "$BBR3_PATCH" ]; then
            [ -f "$BBR3_PATCH" ] || net_fail "BBRv3 patch does not exist: ${BBR3_PATCH#"$KERNEL_PATCHES"/}"
            if patch -p1 --dry-run --forward < "$BBR3_PATCH" >/dev/null 2>&1; then
              patch -p1 --no-backup-if-mismatch < "$BBR3_PATCH"
              echo "[+] BBRv3 patch applied"
            elif patch -p1 --dry-run --forward -F 3 < "$BBR3_PATCH" >/dev/null 2>&1; then
              # LTS branches keep merging upstream stable commits (such as the
              # tcp_min_rcvbuf change in sysctl_net_ipv4.c), so the patch's context lines drift. fuzz 3 only relaxes context
              # matching; the hunk contents must still land as-is, so this kind of offset can be absorbed safely.
              patch -p1 --no-backup-if-mismatch -F 3 < "$BBR3_PATCH"
              echo "[+] BBRv3 patch applied (LTS context drift, fuzz 3)"
            elif grep -q '^config TCP_CONG_BBR3' net/ipv4/Kconfig; then
              echo "[*] BBRv3 patch was already applied; skipping"
            else
              net_fail "Failed to apply the BBRv3 patch (${AVER}-${KVER})"
            fi
            # Prevent continuing to compile after a fuzzy apply that missed new files/config entries
            [ -f net/ipv4/tcp_bbr3.c ] || net_fail "net/ipv4/tcp_bbr3.c is missing after applying the BBRv3 patch"
            grep -q '^config TCP_CONG_BBR3' net/ipv4/Kconfig || net_fail "TCP_CONG_BBR3 config entry is missing after applying the BBRv3 patch"
          else
            echo "[*] ${AVER}-${KVER} has no BBRv3 backport; using BBR v1"
          fi

          # Older kernels such as 5.15.41 lack the tcp_snd_cwnd accessors (newer 5.15 has backported them),
          # which the BBRv3 patch depends on by default; add them only when missing.
          if [ -n "$BBR3_PATCH" ] && ! grep -q 'tcp_snd_cwnd' include/net/tcp.h; then
            python3 "$GITHUB_WORKSPACE/scripts/net_compat/add_tcp_snd_cwnd.py" \
              || net_fail "Failed to handle the tcp_snd_cwnd compatibility for the old kernel"
          fi

          # 5.10 lacks proc_dou8vec_minmax (a 5.15+ sysctl API that BBRv3 depends on); add two prerequisite patches
          if [ "$KVER" = "5.10" ] && ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h 2>/dev/null; then
            for prepatch in sysctl_add_proc_dou8vec_minmax sysctl_fix_data-races_in_proc_dou8vec_minmax; do
              if patch -p1 --dry-run < "$BBR3_DIR/$prepatch.patch" >/dev/null 2>&1; then
                patch -p1 --no-backup-if-mismatch < "$BBR3_DIR/$prepatch.patch"
              else
                net_fail "Failed to apply the 5.10 sysctl prerequisite patch: $prepatch"
              fi
            done
            echo "[+] 5.10 sysctl prerequisite patches applied"
          fi

          set_config() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }

          # Full IPSet suite + netfilter integration (Kconfig verified to exist in every version)
          for cfg in IP_SET IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT \
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP \
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC \
            IP_SET_HASH_NETPORTNET IP_SET_HASH_NET IP_SET_HASH_NETNET \
            IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE IP_SET_LIST_SET \
            NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET NETFILTER_XT_TARGET_LOG \
            NETFILTER_XT_MATCH_RECENT IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            set_config "CONFIG_$cfg" y
          done
          set_config CONFIG_IP_SET_MAX 65534

          # TCP congestion control algorithm: versions with the BBRv3 patch default to bbr3, the rest default to bbr
          for cfg in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC \
            TCP_CONG_BIC TCP_CONG_WESTWOOD TCP_CONG_HTCP; do
            set_config "CONFIG_$cfg" y
          done
          if [ -n "$BBR3_PATCH" ]; then
            set_config CONFIG_TCP_CONG_BBR3 y
            set_config CONFIG_DEFAULT_BBR3 y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr3"'
          else
            set_config CONFIG_DEFAULT_BBR y
            set_config CONFIG_DEFAULT_TCP_CONG '"bbr"'
          fi

          # Traffic-shaping Qdisc + connection marking + TTL/HopLimit + WireGuard
          for cfg in NET_SCH_FQ NET_SCH_FQ_CODEL NET_SCH_CAKE NET_ACT_CONNMARK \
            IP_NF_TARGET_TTL IP6_NF_TARGET_HL IP6_NF_MATCH_HL WIREGUARD; do
            set_config "CONFIG_$cfg" y
          done

          # CIFS network filesystem (NETFS_SUPPORT is a hidden symbol, selected by Kconfig as needed)
          for cfg in CIFS NETWORK_FILESYSTEMS KEYS CIFS_XATTR CIFS_POSIX; do
            set_config "CONFIG_$cfg" y
          done

          # CIFS=y also promotes the NETFS_SUPPORT / CRYPTO_LIB_ARC4 that its Kconfig selects
          # to built-in, while the GKI module list still expects the corresponding .ko, so the dist-stage artifact validation would fail; the
          # corresponding entries must be deleted. The list location varies by version: 6.12 and earlier use the root modules.bzl, from 6.18
          # it moved to bazel/modules_private.bzl (the root modules.bzl is only a forwarding shim).
          # libarc4 only needs handling in versions where the CIFS Kconfig declares the select (6.18+); earlier versions
          # keep it as a module via CONFIG_PPP_MPPE=m, and deleting it would break its dependency instead.
          if grep -q '^CONFIG_CIFS=y$' "$DEFCONFIG"; then
            for MODULE_LIST in modules.bzl bazel/modules_private.bzl; do
              [ -f "$MODULE_LIST" ] || continue
              sed -i '/"fs\/netfs\/netfs\.ko",/d' "$MODULE_LIST"
              if grep -q 'select CRYPTO_LIB_ARC4' fs/smb/client/Kconfig 2>/dev/null || grep -q 'select CRYPTO_LIB_ARC4' fs/cifs/Kconfig 2>/dev/null; then
                sed -i '/"lib\/crypto\/libarc4\.ko",/d' "$MODULE_LIST"
              fi
            done
          fi

          # Post-write validation: key symbols must be persisted
          grep -q '^CONFIG_IP_SET=y$' "$DEFCONFIG" || net_fail "IPSet config write validation failed"
          grep -q '^CONFIG_IP_SET_MAX=65534$' "$DEFCONFIG" || net_fail "IPSet maximum set count config write validation failed"
          grep -q '^CONFIG_NET_SCH_FQ=y$' "$DEFCONFIG" || net_fail "FQ qdisc config write validation failed"
          grep -q '^CONFIG_CIFS=y$' "$DEFCONFIG" || net_fail "CIFS config write validation failed"
          if [ -n "$BBR3_PATCH" ]; then
            grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr3"$' "$DEFCONFIG" || net_fail "BBRv3 default congestion control config write validation failed"
          else
            grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' "$DEFCONFIG" || net_fail "BBR default congestion control config write validation failed"
          fi
          echo "[+] Network enhancement configuration complete"

      - name: Apply Re-Kernel
        if: inputs.use_rekernel
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if ( set -e
            echo "Integrating Re-Kernel..."
            TMP_REKERNEL=/tmp/rekernel
            rm -rf "$TMP_REKERNEL"
            git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_REKERNEL"

            # Sync the complete driver sources after the upstream split
            rm -rf common/drivers/rekernel
            mkdir -p common/drivers/rekernel
            cp -a "$TMP_REKERNEL/LKM-Source/." common/drivers/rekernel/

            # Adapt the upstream out-of-tree module config into a kernel built-in driver
            REKERNEL_MAKEFILE="common/drivers/rekernel/Makefile"
            sed -i 's/^obj-m := rekernel\.o$/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$REKERNEL_MAKEFILE"
            grep -qF 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' "$REKERNEL_MAKEFILE" || \
              echo 'ccflags-$(CONFIG_REKERNEL_LEGACY_NETLINK) += -DLEGACY_NETLINK' >> "$REKERNEL_MAKEFILE"
            sed -i '/^[[:space:]]*depends on MODULES[[:space:]]*$/d' common/drivers/rekernel/Kconfig

            # Mount into the driver tree
            if ! grep -qF 'source "drivers/rekernel/Kconfig"' common/drivers/Kconfig; then
              sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' common/drivers/Kconfig
            fi
            if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' common/drivers/Makefile; then
              echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> common/drivers/Makefile
            fi

            # Fix header include paths (to suit in-tree compilation)
            sed -i 's|#include <../android/binder_internal.h>|#include "../android/binder_internal.h"|g' common/drivers/rekernel/rekernel_binder.c
            # Add the definitions that 5.10 binder_internal.h needs to use DEFINE_SHOW_ATTRIBUTE
            grep -qF '#include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c || \
              sed -i '/#include <linux\/kprobes.h>/a #include <linux/seq_file.h>' common/drivers/rekernel/rekernel_binder.c

            # Configure defconfig (idempotent)
            grep -q '^CONFIG_REKERNEL=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
            grep -q '^CONFIG_REKERNEL_NETWORK=y$' "$DEFCONFIG" || echo "CONFIG_REKERNEL_NETWORK=y" >> "$DEFCONFIG"
          ); then
            exit 0
          fi

          # Integration failed: roll back the half-finished state, so leftover references do not break the compile
          rm -rf common/drivers/rekernel
          sed -i '\|source "drivers/rekernel/Kconfig"|d' common/drivers/Kconfig 2>/dev/null || true
          sed -i '\|obj-$(CONFIG_REKERNEL) += rekernel/|d' common/drivers/Makefile 2>/dev/null || true
          sed -i '/^CONFIG_REKERNEL=y$/d; /^CONFIG_REKERNEL_NETWORK=y$/d' "$DEFCONFIG" 2>/dev/null || true

          if [ "$SKIP_INCOMPATIBLE" = "true" ]; then
            echo "::warning title=Re-Kernel skipped::Re-Kernel integration failed (repository unavailable or sources do not fit the current kernel); rolled back and feature skipped"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> ⏭️ **Re-Kernel** skipped automatically: integration failed (repository unavailable or sources do not fit the current kernel), rolled back (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "REKERNEL_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Re-Kernel integration failed"
          exit 1

      - name: Configure kernel options
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KALLSYMS_ALL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          # Whenever the 6.18 modpost is given -u (the TRIM_UNUSED_KSYMS allowlist), it records every exported symbol
          # as "protected" by default (KSYM_FLAG_PROTECTED is written into __kflagstab); under
          # #ifdef CONFIG_MODULE_SIG the kernel refuses unsigned modules that reference these symbols, returning -EACCES.
          # The kernel in this repository is signed with a key generated at build time, while modules in the official system_dlkm (signed with
          # Google's key) always get sig_ok=false, so modules such as 8021q, usbnet and the bluetooth transport layer
          # are all refused to load, resulting in WiFi, Bluetooth and mobile data all being down.
          # Removing this default marker is enough (the -u allowlist trimming behavior is unchanged).
          MODPOST_C="common/scripts/mod/modpost.c"
          if [ -f "$MODPOST_C" ] && grep -q 'default_symbol_protected_status = true;' "$MODPOST_C"; then
            sed -i '/default_symbol_protected_status = true;/d' "$MODPOST_C"
            echo "modpost: removed the default protected marker from exported symbols (6.18 -EACCES fix)"
          fi

          # With KSU disabled there is no KernelSU in the source, and CONFIG_KSU would be rejected by the bazel defconfig validation
          if [ "${{ inputs.ksu_mode }}" != "Disable KSU" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          fi

          # The SukiSU-Nova main branch sets the Kconfig default of KSU_SUSFS to y; when SUSFS is not integrated
          # (android17-6.18 has no SUSFS branch, or SUSFS was disabled, or SUSFS was skipped automatically)
          # it must be turned off explicitly, otherwise kernel_includes.h would reference the non-existent <linux/susfs.h>
          # and cause a compile failure. Write it only when the KernelSU source actually declares this option, to avoid fragment validation failures.
          if [ "${{ inputs.ksu_variant }}" = "SukiSU-Nova" ] && [ "${{ inputs.ksu_mode }}" != "Disable KSU" ] \
            && { [ "${{ inputs.enable_susfs }}" != "true" ] || [ "$SUSFS_SKIPPED" = "true" ]; }; then
            if grep -qsE '^[[:space:]]*config[[:space:]]+KSU_SUSFS([[:space:]]|$)' KernelSU/kernel/Kconfig; then
              echo "# CONFIG_KSU_SUSFS is not set" >> "$DEFCONFIG"
            fi
          fi

          # After the BakaSU upstream rename, the Kconfig default dropped @%REPO_NAME%; add the template back explicitly,
          # and together with ksu_post_setup.sh rewriting REPO_NAME := LingLuo, the manager can display the @LingLuo suffix
          if [ "${{ inputs.ksu_variant }}" == "BakaSU" ] && [ "${{ inputs.ksu_mode }}" != "Disable KSU" ]; then
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"' >> "$DEFCONFIG"
          fi

          if [ "${{ inputs.ksu_variant }}" == "SukiSU-Nova" ] || [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            if [ "${{ inputs.use_kpm }}" == "true" ]; then
              if grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' common KernelSU 2>/dev/null; then
                echo "CONFIG_KPM=y" >> "$DEFCONFIG"
              elif [ "$SKIP_INCOMPATIBLE" = "true" ]; then
                echo "::warning title=KPM skipped::The current KernelSU code does not declare CONFIG_KPM; KPM feature skipped"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "> ⏭️ **KPM** skipped automatically: the current KernelSU code does not declare CONFIG_KPM (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo "Error: KPM was requested, but the current KernelSU code does not declare CONFIG_KPM" >&2
                exit 1
              fi
            fi
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            if [ "${{ inputs.use_kpm }}" == "true" ]; then
              echo "::warning title=KPM not applicable::FinaSU does not support KPM; the option is ignored and the build continues"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "> ⏭️ **KPM** ignored: the FinaSU variant does not support KPM (build not interrupted)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          # FinaSU + SUSFS: select the SUSFS Inline hook backend; the matching 50_add patch
          # provides direct ksu_handle_* call sites, which the FinaSU Kbuild validates at compile time.
          # If the current kernel/patch lacks hook points, fall back to Tracepoint to avoid a compile failure.
          if [ "${{ inputs.ksu_variant }}" == "FinaSU" ] && [ "${{ inputs.enable_susfs }}" == "true" ]; then
            chmod +x KernelSU/kernel/tools/check_susfs_inline.sh 2>/dev/null || true
            if grep -q '^config KSU_HOOK_SUSFS_INLINE' KernelSU/kernel/Kconfig 2>/dev/null \
              && bash KernelSU/kernel/tools/check_susfs_inline.sh common >/dev/null 2>&1; then
              echo "CONFIG_KSU_HOOK_SUSFS_INLINE=y" >> "$DEFCONFIG"
              echo "FinaSU: SUSFS Inline hook backend selected"
            else
              echo "::warning title=SUSFS Inline fallback::The current kernel lacks inline hook call sites; falling back to the Tracepoint backend"
            fi
          fi

          CURRENT_SUB="${{ inputs.sub_level }}"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          if [[ "${{ inputs.ksu_variant }}" == "BakaSU" && "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "$CURRENT_SUB" -ge 74 && "$CURRENT_SUB" -le 137 ]]; then
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
            # Fix 5.15.74~5.15.137: kallsyms_on_each_symbol is only compiled under LIVEPATCH, which makes the BakaSU link fail
            KALLSYMS_C="./common/kernel/kallsyms.c"
            if [ -f "$KALLSYMS_C" ] \
              && grep -qF 'int kallsyms_on_each_symbol' "$KALLSYMS_C" \
              && grep -qF '#endif /* CONFIG_LIVEPATCH */' "$KALLSYMS_C"; then
              sed -i '/^#ifdef CONFIG_LIVEPATCH$/,/^int kallsyms_on_each_symbol/ { /^#ifdef CONFIG_LIVEPATCH$/d }' "$KALLSYMS_C"
              sed -i '/^int kallsyms_on_each_symbol/,/^#endif \/\* CONFIG_LIVEPATCH \*\// { /^#endif \/\* CONFIG_LIVEPATCH \*\//d }' "$KALLSYMS_C"
              echo "Fixed the LIVEPATCH compile restriction of kallsyms_on_each_symbol"
            fi
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add SUSFS config
        if: inputs.enable_susfs && env.SUSFS_SKIPPED != 'true'
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Configure kernel name
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            # 6.12/6.18 use protected_module_names_list to generate the "protected symbol exports" list. The kernel in this repository
            # is signed with a key generated at build time, and modules in the official system_dlkm (signed with Google's key) are treated as
            # unsigned modules; when exporting protected symbols such as rfkill_*/hci_* they are refused to load outright (exports
            # protected symbol), causing WiFi/Bluetooth to disappear. Removing this attribute turns off the export-side check.
            sed -i '/^[[:space:]]*protected_module_names_list[[:space:]]*=[[:space:]]*":gki_[a-z0-9_]*_protected_module_names",$/d' ./common/BUILD.bazel
            # kmi_symbol_list_strict_mode is a multi-line select({...}) in android17-6.18,
            # and deleting only the first line with a whole-line sed would leave a broken dictionary and cause a BUILD.bazel syntax error,
            # so a script is used to remove it completely in all three forms: attribute / dictionary entry / select block
            python3 "$GITHUB_WORKSPACE/scripts/kleaf_fixes/strip_kmi_strict_mode.py" ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          fi

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          elif [ ! -f "build/build.sh" ]; then
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android14-6.1")  KMI_TAG="android14-11" ;;
              "android15-6.6")  KMI_TAG="android15-8" ;;
              "android16-6.12") KMI_TAG="android16-5" ;;
              *) KMI_TAG="${{ inputs.android_version }}" ;;
            esac

            if [ "${{ inputs.kernel_version }}" = "6.1" ]; then
              KMI_LOCAL="-${KMI_TAG}-g${GHASH}-${BID}-4k"
              sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
              sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
            else
              SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"
              perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' ./scripts/setlocalversion 2>/dev/null || true
            fi
          fi

      - name: Set custom build time
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            # Strip leading/trailing whitespace and collapse consecutive spaces into single-space separators (handles all three forms: Dec 03 / Dec 3 / Dec  3)
            INPUT_TIME="$(printf '%s' "$INPUT_TIME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g')"

            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( ?[1-9]|0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=Invalid build time format::The custom build time must look like Tue Dec  1 08:10:00 UTC 2026; remove any extra prefix and use a two-digit date."
              exit 1
            fi

            # Parse into a standard UTC time (can reject non-existent dates, such as February 30)
            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %e %T UTC %Y' 2>/dev/null || true)"
            if [[ -z "$NORMALIZED_TIME" ]]; then
              echo "::error title=Invalid build time::The custom build time cannot be parsed as a real UTC time."
              exit 1
            fi

            # GNU date ignores the weekday field in its input, so remove the weekday, parse out the real weekday separately, and then compare
            TYPED_WD="${INPUT_TIME%% *}"
            REAL_WD="$(LC_ALL=C TZ=UTC date -u -d "${INPUT_TIME#* }" +%a 2>/dev/null || true)"
            if [[ -z "$REAL_WD" || "$TYPED_WD" != "$REAL_WD" ]]; then
              echo "::error title=Weekday and date mismatch::The weekday entered does not match the date; it should actually be ${REAL_WD:-Unknown} (reference: $NORMALIZED_TIME)."
              exit 1
            fi

            DATESTR="$NORMALIZED_TIME"
          else
            DATESTR="$(TZ='CST-8' date +'%a %b %d %T UTC %Y')"
          fi

          echo "Using build time: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Unified handling of the mkcompile_h patch
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
              echo "Applying 5.x classic timestamp patch: $f"
              perl -pi -e "s{UTS_VERSION=\"\\\$\(echo \\\$UTS_VERSION \\\$CONFIG_FLAGS \\\$TIMESTAMP \\| cut -b -\\\$UTS_LEN\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              echo "Applying 6.x mkcompile_h patch: $f"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          fi
          
      - name: Compile kernel
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # Generate a separate log for each retry execution
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "Compile attempt: $ATTEMPT"
              echo "Start time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Current KSU latest commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Current SUSFS latest commit date: ${SUSFS_LATEST_COMMIT_DATE}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              if [ -f "build/build.sh" ]; then
                LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
                strings "out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" | grep 'Linux version'
              else
                # Extract the gki_defconfig changes into a fragment, to avoid bazel trim check failures
                FRAG="common/arch/arm64/configs/ksu.fragment"
                diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
                cp "$DEFCONFIG.orig" "$DEFCONFIG"
                echo "=== KSU Fragment contents ==="
                cat "$FRAG"
                echo "========================="
                FRAG_FLAG=""
                if [ -s "$FRAG" ]; then
                  FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
                fi
                LTO_FLAG="--lto=thin"
                # 6.12 and newer GKI are fixed to none under bazel
                KVER_NUM="${{ inputs.kernel_version }}"
                if [ "$(printf '%s\n' "6.12" "$KVER_NUM" | sort -V | head -1)" = "6.12" ]; then
                  LTO_FLAG="--lto=none"
                fi
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast $LTO_FLAG $FRAG_FLAG //common:kernel_aarch64_dist || exit 1
                strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
              fi

              echo "Current KSU latest commit date: ${KSU_LATEST_COMMIT_DATE}"
              echo "Current SUSFS latest commit date: ${SUSFS_LATEST_COMMIT_DATE}"
              echo "If the dates differ or are too far apart, the patch becomes invalid and the compile fails"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "End time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "Exit code: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: Collect compile failure logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android version: ${{ inputs.android_version }}"
            echo "Kernel version: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "Security patch level: ${{ inputs.os_patch_level }}"
            echo "KernelSU variant: ${{ inputs.ksu_variant }}"
            echo "Config name: ${CONFIG:-Unknown}"
            echo "Git commit: $GITHUB_SHA"
            echo "Workflow URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Compile attempts: ${COMPILE_ATTEMPTS:-Unknown}"
            echo "Final exit code: ${COMPILE_EXIT_CODE:-Unknown}"
            echo "KSU commit date: ${KSU_LATEST_COMMIT_DATE:-Unknown}"
            echo "SUSFS commit date: ${SUSFS_LATEST_COMMIT_DATE:-Unknown}"
          } > "$LOG_DIR/summary.txt"

          printf '%s\n' "${{ inputs.ksu_variant }}_kernel-${CONFIG}-Build-Logs" > "$LOG_DIR/artifact-name.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: Upload compile failure logs
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Prepare Boot image
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: Create AnyKernel3 archive
        if: inputs.artifact_upload_mode == 'Upload all'
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${AK3_NAME}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      - name: Organize AnyKernel3 flashable package (upload-only mode)
        if: inputs.artifact_upload_mode != 'Upload all'
        run: |
          mv ./Image "$ANYKERNEL3/Image"
          mkdir -p "$GITHUB_WORKSPACE/AnyKernel3-package"
          cp -a "$ANYKERNEL3/." "$GITHUB_WORKSPACE/AnyKernel3-package/"

      - name: Build Boot image (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Build Boot image (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' || inputs.android_version == 'android16' || inputs.android_version == 'android17'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot.img

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-gz.img

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${NAME_SUBLEVEL}-${{ inputs.os_patch_level }}-boot-lz4.img

      - name: Collect patch conflict files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej file(s)"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Upload AnyKernel3 flashable package
        if: inputs.artifact_upload_mode != 'Upload all'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.AK3_NAME }}-AnyKernel3
          path: "AnyKernel3-package/*"
          if-no-files-found: error
          compression-level: 9

      - name: Upload all build artifacts
        if: inputs.artifact_upload_mode == 'Upload all'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.AK3_NAME }}-AnyKernel3
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      - name: Upload patch conflict files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
