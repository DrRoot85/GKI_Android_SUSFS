# ========================================
# GKI Kernel Build Main Entry Point
# ========================================
# This workflow is the project's unified entry point, used to:
# 1. Build all GKI kernel versions
# 2. Fetch the latest KSU Manager
# 3. Collect patch conflict files and build failure logs for debugging
# 4. Create a GitHub Release (optional)
# ========================================

name: Build Kernel

# Concurrency control: Only one run per branch at a time; new runs cancel previous ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release Configuration ====================
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU Variant ====================
      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - SukiSU-Nova
          - BakaSU
          - FinaSU
        default: FinaSU

      build_channel:
        description: "Manager Build Channel"
        type: choice
        options:
          - "(Release)"
          - "(HEAD)"
        default: "(Release)"

      # ==================== Optional Configuration ====================
      version:
        description: "Custom Kernel Version Name"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom Build Time (leave blank = automatically) (Example Tue Dec  1 08:10:00 UTC 2026)"
        type: string
        default: ""
        required: false
      # ==================== Option Configuration ====================
      use_kpm:
        description: "KPM Feature (Supported only by SukiSU-Nova; enabling it does not apply patches)"
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces Container Support (5.10–6.6: Slot patches; 6.12: On/Off. Options with NTSync will also inject NTSync)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
          - "678 (NTSync)"
          - "123 (NTSync)"
          - "345 (NTSync)"
        default: "off"
      artifact_upload_mode:
        description: "Build Artifact Upload Mode"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip"
          - "Upload All"
        default: "Upload AnyKernel3.zip"
      ksu_mode:
        description: "KernelSU / SUSFS Mode"
        type: choice
        options:
          - "Enabled"
          - "Disable SUSFS"
          - "Disable KernelSU"
        default: "Enabled"

      # ==================== Feature Toggles ====================
      use_zram:
        description: "Enable ZRAM Compressio（only 5.10~6.6，6.12/6.18 are not supported）"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG Baseband Protection"
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable Network Enhancements (BBRv3 + IPSet + Qdisc + CIFS)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel Drivers"
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount Metamodule（requires manually flashing the companion module）"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex Fix Chain"
        type: boolean
        default: false

      # ==================== Compatibility ====================
      skip_incompatible:
        description: "Automatically skip incompatible or unavailable features without interrupting the build"
        type: boolean
        default: true

      # ==================== Build Version Selection ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_10:
        description: "Android 13 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_5_15:
        description: "Android 14 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_a17_6_18:
        description: "Android 17 - 6.18（SUSFS is not yet supported; permanently disabled）"
        type: boolean
        default: false
      build_all:
        description: "Build All Versions"
        type: boolean
        default: true

jobs:
  # ==================== Fetch Manager ====================
  # Download the latest KernelSU Manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_nomount: ${{ inputs.use_nomount }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}

  # ==================== Android 12 - 5.10 Build ====================
  build-a12-5-10:
